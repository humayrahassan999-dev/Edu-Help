<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Help - AI Study Assistant</title>
    <style>
        :root {
            --primary: #00796b;
            --primary-dark: #004d40;
            --accent: #ff7043;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .logo-icon {
            background: var(--accent);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .header-text h1 { font-size: 1.5rem; font-weight: 700; text-align: left; }
        .header-text p { font-size: 0.85rem; opacity: 0.9; text-align: left; }
        
        nav {
            display: flex;
            justify-content: center;
            background-color: var(--primary-dark);
            padding: 0.5rem;
            gap: 5px;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 0.95rem;
            border-radius: 4px;
            transition: background 0.3s;
        }
        .nav-btn:hover { background-color: rgba(255,255,255,0.1); }
        .nav-btn.active {
            background-color: var(--accent);
            font-weight: bold;
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }
        .section {
            display: none;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Chat UI */
        #ai-buddy.section { text-align: left; }
        #api-guide.section { text-align: left; }

            display: flex;
            flex-direction: column;
            height: 400px;
