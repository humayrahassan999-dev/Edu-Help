<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Study Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #00796b;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #004d40;
            padding: 0.5rem;
        }
        .nav-btn {
            background: none;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
        }
        .nav-btn.active {
            background-color: #ff7043;
            border-radius: 4px;
        }
        .section {
            display: none;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .section.active {
            display: block;
        }
        #chat-messages {
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
        }
        .message.user {
            background-color: #e3f2fd;
            margin-left: auto;
            text-align: right;
        }
        .message.ai {
            background-color: #e8f5e9;
            margin-right: auto;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background-color: #ff7043;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gemini AI Study Assistant</h1>
    </header>

    <nav>
        <button class="nav-btn" onclick="switchTab('textbooks', this)">Textbooks</button>
        <button class="nav-btn active" onclick="switchTab('ai-buddy', this)">AI Study Buddy</button>
        <button class="nav-btn" onclick="switchTab('api-guide', this)">API Guide</button>
    </nav>

    <!-- AI Study Buddy Tab -->
    <div id="ai-buddy" class="section active">
        <div id="key-status" style="margin-bottom: 10px; font-size: 0.9rem; color: #555;">🔑 Key Status: Not Connected</div>
        
        <div id="chat-messages">
            <div class="message ai">Hello Class 6 Student! 👋 I am your Gemini Study Assistant. Ask me any study question, math problem, or science topic!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Ask your study question here.." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- API Guide / Configuration Tab -->
    <div id="api-guide" class="section">
        <h2>API Configuration</h2>
        <p>Enter your Gemini API Key below:</p>
        <input type="password" id="api-key-input" placeholder="Paste your API key here" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
        <button onclick="saveApiKey()" style="padding: 10px 20px; background-color: #00796b; color: white; border: none; border-radius: 4px; cursor: pointer;">Save Key</button>
    </div>

    <!-- Textbooks Tab -->
    <div id="textbooks" class="section">
        <h2>Class Textbooks</h2>
        <p>Your study textbooks and chapters will appear here.</p>
    </div>

    <!-- Link to your separate script file -->
    <script src="script.js"></script>
</body>
</html>
